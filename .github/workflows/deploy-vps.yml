# Deploys only after the CI workflow for main has completed successfully.
# The VPS remains the source of runtime state, while GitHub main is the source of code.
name: Deploy VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          PULSE_VPS_SSH_PRIVATE_KEY: ${{ secrets.PULSE_VPS_SSH_PRIVATE_KEY }}
          PULSE_VPS_KNOWN_HOSTS: ${{ secrets.PULSE_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$PULSE_VPS_SSH_PRIVATE_KEY" ] || { echo "::error::PULSE_VPS_SSH_PRIVATE_KEY is not configured"; exit 1; }
          [ -n "$PULSE_VPS_KNOWN_HOSTS" ] || { echo "::error::PULSE_VPS_KNOWN_HOSTS is not configured"; exit 1; }
          eval "$(ssh-agent -s)"
          printf '%s\n' "$PULSE_VPS_SSH_PRIVATE_KEY" | ssh-add -
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PULSE_VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Deploy main to the VPS
        env:
          PULSE_VPS_HOST: ${{ secrets.PULSE_VPS_HOST }}
          PULSE_VPS_PORT: ${{ secrets.PULSE_VPS_PORT || '41122' }}
          PULSE_VPS_USER: ${{ secrets.PULSE_VPS_USER || 'altlabs' }}
          PULSE_VPS_PATH: ${{ secrets.PULSE_VPS_PATH || '/home/altlabs/services/pulse' }}
          PULSE_VPS_BRANCH: main
        run: scripts/deploy-vps.sh
